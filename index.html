<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 취업 노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14202b;--sub:#5b6b7a;--line:#d5dde5;--accent:#0f6e6e;--warn:#c2410c;--soft:#e3f0f0}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#e8eef3;--sub:#93a3b1;--line:#2b3946;--accent:#4fb8b8;--warn:#f08a5d;--soft:#1c3235}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,sans-serif;line-height:1.6}
header,main{max-width:1000px;margin:0 auto;padding:0 20px}
header{padding-top:36px;padding-bottom:8px}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:-.02em}
.meta{color:var(--sub);font-size:.9rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
.tools input,.tools select,.tools button{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.tools input{flex:1;min-width:160px}
.tools button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding-bottom:48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card.done{opacity:.55}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card h2{font-size:1.2rem;margin:0}
.tag{font-size:.8rem;color:var(--sub)}
.dday{font-weight:700;color:var(--accent);white-space:nowrap}
.dday.soon{color:var(--warn)}
dl{margin:0;font-size:.92rem}
dt{font-weight:600;margin-top:8px}
dd{margin:0;color:var(--sub)}
.link{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:600;text-align:center}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600}
.news{list-style:none;padding:0;margin:8px 0 0;font-size:.9rem}
.news li{padding:6px 0;border-bottom:1px solid var(--line)}
.news a{color:var(--ink);text-decoration:none}
.news a:hover{text-decoration:underline}
.news small{color:var(--sub);display:block}
label.chk{font-size:.9rem;color:var(--sub);display:flex;gap:6px;align-items:center}
.empty{color:var(--sub);padding:40px 0}
</style>
</head>
<body>
<header>
  <h1>내 취업 노트</h1>
  <div class="meta" id="updated">불러오는 중…</div>
  <div class="tools">
    <input id="q" type="search" placeholder="기업 또는 업종 검색" aria-label="검색">
    <select id="cat" aria-label="업종 필터"><option value="">전체 업종</option></select>
    <button id="sort" type="button">마감 임박순</button>
    <button id="hide" type="button">지원 완료 숨기기</button>
  </div>
</header>
<main><div class="grid" id="grid"></div></main>

<script>
let companies=[], news={}, sortByDeadline=false, hideDone=false;
let done={};
try{done=JSON.parse(localStorage.getItem("done")||"{}")}catch(e){}

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function dday(d){
  if(!d) return null;
  const t=new Date(d+"T00:00:00"), n=new Date(); n.setHours(0,0,0,0);
  return Math.round((t-n)/86400000);
}

function render(){
  const q=$("q").value.trim().toLowerCase(), cat=$("cat").value;
  let list=companies.filter(c=>
    (!cat||c.category===cat) &&
    (!q||(c.name+" "+(c.category||"")).toLowerCase().includes(q)) &&
    !(hideDone&&done[c.name]));
  if(sortByDeadline){
    list.sort((a,b)=>{
      const x=dday(a.deadline), y=dday(b.deadline);
      return (x===null?9999:x<0?9998:x)-(y===null?9999:y<0?9998:y);
    });
  }
  $("grid").innerHTML=list.length?list.map(card).join(""):'<p class="empty">조건에 맞는 기업이 없습니다.</p>';
  document.querySelectorAll(".chk input").forEach(el=>el.onchange=()=>{
    done[el.dataset.n]=el.checked;
    try{localStorage.setItem("done",JSON.stringify(done))}catch(e){}
    render();
  });
}

function card(c){
  const d=dday(c.deadline);
  const badge=d===null?"":d<0?'<span class="dday">마감</span>':
    `<span class="dday ${d<=7?"soon":""}">${d===0?"D-Day":"D-"+d}</span>`;
  const items=(news[c.name]||[]).map(n=>
    `<li><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a><small>${esc(n.source)} ${esc(n.date)}</small></li>`).join("");
  return `<article class="card ${done[c.name]?"done":""}">
    <div class="top"><div><h2>${esc(c.name)}</h2><div class="tag">${esc(c.category)}</div></div>${badge}</div>
    <dl>
      <dt>공고 일정</dt><dd>${esc(c.schedule)}${c.deadline?" (마감 "+esc(c.deadline)+")":""}</dd>
      <dt>채용 절차</dt><dd>${esc(c.process)}</dd>
      <dt>준비할 것</dt><dd>${esc(c.prep)}</dd>
    </dl>
    <a class="link" href="${esc(c.careerUrl)}" target="_blank" rel="noopener">채용 페이지 열기</a>
    <details><summary>최신 뉴스·보도자료 (${(news[c.name]||[]).length})</summary>
      <ul class="news">${items||"<li>아직 가져온 기사가 없습니다.</li>"}</ul></details>
    <label class="chk"><input type="checkbox" data-n="${esc(c.name)}" ${done[c.name]?"checked":""}> 지원 완료</label>
  </article>`;
}

async function init(){
  try{
    companies=await (await fetch("companies.json?"+Date.now())).json();
    const n=await (await fetch("news.json?"+Date.now())).json();
    news=n.news||{};
    $("updated").textContent=n.updated?"뉴스 마지막 갱신: "+n.updated:"뉴스는 첫 자동 갱신 후 표시됩니다.";
  }catch(e){
    $("updated").textContent="데이터를 불러오지 못했습니다. 파일 이름과 JSON 형식을 확인하세요.";
  }
  [...new Set(companies.map(c=>c.category).filter(Boolean))].forEach(v=>{
    const o=document.createElement("option");o.value=o.textContent=v;$("cat").appendChild(o);
  });
  $("q").oninput=render; $("cat").onchange=render;
  $("sort").onclick=e=>{sortByDeadline=!sortByDeadline;e.target.classList.toggle("on",sortByDeadline);render()};
  $("hide").onclick=e=>{hideDone=!hideDone;e.target.classList.toggle("on",hideDone);render()};
  render();
}
init();
</script>
</body>
</html>
